<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galley · Crew check-in</title>
<style>
:root{
  --bg:#070d18; --panel:#0e1626; --panel2:#152036; --line:#22324f;
  --text:#e8eefc; --muted:#8fa2c7; --accent:#22d3ee; --accent-ink:#04202a;
  --ok:#2ecc71; --warn:#f5b301; --crit:#ff4d4f;
  --mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.45}
button,select,input{font:inherit}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.small{font-size:12px;color:var(--muted)}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 28px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;border-radius:0;padding:5px 12px;font:700 12px system-ui;cursor:pointer;background:transparent;color:var(--muted)}
.lang button.on{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.kick{font:600 11px var(--mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.dotlive{width:6px;height:6px;border-radius:50%;background:var(--ok);display:inline-block}
button{color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible,.crewrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
label.inline{flex-direction:row;align-items:center;gap:6px}
select,input[type=text],input[type=number]{color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}

/* ===== top bar ===== */
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.brand .logo{width:40px;height:40px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--accent);flex:none}
.brand h1{margin:2px 0 0;font-size:17px;letter-spacing:.02em;text-transform:uppercase}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.clock{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.clock .t{font:500 12px var(--mono);color:var(--muted);text-align:right}
.clock .t b{color:var(--text);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);color:var(--ok);border:1px solid rgba(46,204,113,.45);background:rgba(46,204,113,.08);padding:6px 9px;border-radius:6px;text-transform:uppercase}

/* ===== login ===== */
.login{display:grid;gap:12px}
@media(min-width:920px){.login{grid-template-columns:1.25fr 1fr}}
.panelhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.pill{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pill.sensing{color:var(--accent);border-color:rgba(34,211,238,.5)}
.pill.match{color:var(--ok);border-color:rgba(46,204,113,.5)}
.prompt{text-align:center;font-weight:600;margin:4px 0 10px}
.viewfinder{position:relative;width:min(100%,420px);aspect-ratio:4/3;margin:0 auto;background:#050a14;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.viewfinder .corner{position:absolute;width:22px;height:22px;border:2px solid var(--accent);z-index:3}
.viewfinder .c1{top:10px;left:10px;border-right:0;border-bottom:0}.viewfinder .c2{top:10px;right:10px;border-left:0;border-bottom:0}
.viewfinder .c3{bottom:10px;left:10px;border-right:0;border-top:0}.viewfinder .c4{bottom:10px;right:10px;border-left:0;border-top:0}
.viewfinder .vx,.viewfinder .hx{position:absolute;background:rgba(143,162,199,.18);z-index:2}
.viewfinder .vx{left:50%;top:0;bottom:0;width:1px}.viewfinder .hx{top:50%;left:0;right:0;height:1px}
.viewfinder .sweep{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);box-shadow:0 0 12px var(--accent);z-index:3;top:50%;opacity:.0}
.viewfinder.sensing .sweep{opacity:.9;animation:sweep 2.2s ease-in-out infinite}
@keyframes sweep{0%{top:12%}50%{top:88%}100%{top:12%}}
@media(prefers-reduced-motion:reduce){.viewfinder.sensing .sweep{animation:none}}
.viewfinder .mirror{position:absolute;inset:0;transform:scaleX(-1);display:none;z-index:1}
.viewfinder.live .mirror{display:block}
.viewfinder video,.viewfinder canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewfinder .idle{position:absolute;inset:0;display:grid;place-items:center;z-index:2}
.viewfinder.live .idle{display:none}
.idcard{display:grid;justify-items:center;gap:6px;padding:14px 18px;border:1px solid rgba(143,162,199,.25);border-radius:10px;background:rgba(14,22,38,.7);min-width:62%}
.idcard .face{width:76px;height:76px;border-radius:12px;border:2px solid var(--ok);background:rgba(46,204,113,.08);display:grid;place-items:center;overflow:hidden}
.idcard .face img{width:100%;height:100%;object-fit:cover}
.idcard .who{font-weight:700;font-size:16px}
.idcard .role{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.idcard .dist{font:600 10px var(--mono);color:var(--ok);letter-spacing:.04em}
.camfoot{display:flex;justify-content:space-between;width:min(100%,420px);margin:6px auto 0;font:500 10px var(--mono);color:var(--muted)}
.result{display:flex;align-items:center;gap:10px;width:min(100%,460px);margin:12px auto 0;border:1px solid rgba(46,204,113,.45);background:rgba(46,204,113,.08);border-radius:8px;padding:10px 12px}
.result .ck{width:28px;height:28px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#062413;flex:none}
.result b{display:block}
.result .sub{font:500 11px var(--mono);color:var(--muted)}
.result .camoff{margin-left:auto;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.status{text-align:center;font-size:13px;color:var(--muted);min-height:1.5em;margin-top:8px}
.status.warn{color:var(--warn)}
.privacy{display:flex;gap:12px;align-items:flex-start;margin-top:12px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px}
.privacy .ic{color:var(--accent);flex:none}
.privacy h4{margin:0 0 2px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.privacy p{margin:0;font-size:13px;color:var(--muted)}

.crewlist{display:grid;gap:8px;margin-top:10px}
.crewrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.crewrow.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.crewrow .av{width:40px;height:40px;border-radius:8px;background:#1d2a45;display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.crewrow.sel .av{background:var(--accent);color:var(--accent-ink)}
.crewrow .av img{width:100%;height:100%;object-fit:cover}
.crewrow .meta{min-width:0;flex:1}
.crewrow .nm{font-weight:700;display:flex;align-items:center;gap:6px}
.crewrow .rl{font-size:12px;color:var(--muted)}
.crewrow .ls{font:500 10px var(--mono);color:var(--muted)}
.crewrow .ls.ok{color:var(--ok)}
.crewitem{display:flex;gap:6px;align-items:stretch}
.delbtn{flex:none;width:34px;padding:0;font-size:18px;color:var(--muted)}
.delbtn:hover{color:var(--crit);border-color:var(--crit)}
.tag{font:600 10px var(--mono);text-transform:uppercase;padding:3px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.tag.match{color:var(--ok);border-color:rgba(46,204,113,.5);background:rgba(46,204,113,.1)}
.regbtn{width:100%;margin-top:4px;font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.regform{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:10px;background:var(--panel2)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:6px 0 10px}
.sensorpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 10px;margin:6px 0 10px}
.fb{margin-top:14px}
.fb .lbl{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.proceed{width:100%;margin-top:12px;padding:14px;font:700 14px var(--mono);letter-spacing:.06em;text-transform:uppercase}

/* ===== scan view ===== */
.scan{display:grid;gap:12px}
@media(min-width:920px){.scan{grid-template-columns:minmax(300px,400px) 1fr}}
.crewbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.crewbar .av{width:40px;height:40px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--accent);overflow:hidden;flex:none}
.crewbar .av img{width:100%;height:100%;object-fit:cover}
.crewbar b{display:block}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-top:12px}
.sensors{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.sensors span{font:500 11px var(--mono);border:1px solid var(--line);border-radius:6px;padding:3px 7px;color:var(--muted)}
.card h2{margin:0 0 10px;font:600 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.zone{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--panel2);animation:in .35s ease-out}
.zone.ok{border-left-color:var(--ok)} .zone.warn{border-left-color:var(--warn)} .zone.crit{border-left-color:var(--crit)} .zone.none{border-left-color:var(--line);opacity:.75}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.zone{animation:none}}
.zhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.zhead h3{margin:0;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 11px system-ui;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.chip.ok{color:var(--ok);background:rgba(46,204,113,.14)} .chip.warn{color:var(--warn);background:rgba(245,179,1,.14)} .chip.crit{color:var(--crit);background:rgba(255,77,79,.16)}
.metric{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(90px,.8fr) minmax(120px,1.4fr);gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.metric:first-of-type{border-top:0}
.metric .name{display:flex;align-items:flex-start;gap:6px}
.metric .dev{display:block;font:500 10px var(--mono);color:var(--muted)}
.metric .val{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.metric .val small{font-weight:400;color:var(--muted);font-size:11px;margin-left:2px}
.metric .usual{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ico{width:14px;height:14px;flex:none;margin-top:2px}
.rbar{width:100%;height:16px;display:block}
.advice{font-size:13px;margin:6px 0 2px}
.src{font-size:11px;color:var(--muted)}
.src a{color:var(--accent)}
.summary{border-radius:10px;padding:12px 14px;border:1px solid;margin-top:4px}
.summary.ok{background:rgba(46,204,113,.10);border-color:var(--ok)}
.summary.warn{background:rgba(245,179,1,.10);border-color:var(--warn)}
.summary.crit{background:rgba(255,77,79,.12);border-color:var(--crit)}
.summary h3{margin:0 0 4px;font-size:16px}
.note{font-size:11px;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ top bar (shared) ============ -->
  <div class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="9" width="6" height="6" rx="1"/><path d="M3 12h6M15 12h6M12 3v6M12 15v6M5 5l3 3M16 16l3 3"/></svg></div>
      <div>
        <div class="kick"><span id="t-login_kicker"></span><span class="dotlive"></span></div>
        <h1 id="t-login_title"></h1>
        <p id="t-login_sub"></p>
      </div>
    </div>
    <div class="clock">
      <div class="t">MET: <b id="met">--</b><br>UTC: <b id="utc">--</b></div>
      <span class="badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg><span id="t-local_badge"></span></span>
      <div class="lang" role="group" aria-label="Idioma / Language"><button type="button" id="langEs">ES</button><button type="button" id="langEn">EN</button></div>
    </div>
  </div>

  <!-- ============ SCREEN 1: biometric login ============ -->
  <section id="viewLogin" class="login" aria-label="Crew biometric check-in">
    <div class="card">
      <div class="panelhead">
        <div class="kick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg><span id="t-optic"></span></div>
        <span class="pill" id="pill"><span class="dotlive"></span><span id="pillText"></span></span>
      </div>
      <div class="prompt" id="t-look_prompt"></div>
      <div class="viewfinder" id="vf">
        <span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span>
        <span class="vx"></span><span class="hx"></span><span class="sweep"></span>
        <div class="mirror"><video id="camVideo" autoplay muted playsinline></video><canvas id="camOverlay"></canvas></div>
        <div class="idle">
          <div class="idcard">
            <div class="face" id="idFace"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2ecc71" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 10h.01M16 10h.01M9 15c2 1.5 4 1.5 6 0"/></svg></div>
            <div class="dist" id="idDist"></div>
            <div class="who" id="idWho">—</div>
            <div class="role" id="idRole"></div>
          </div>
        </div>
      </div>
      <div class="camfoot"><span>face-api · TinyFaceDetector</span><span id="camSrc">WebGL / CPU</span></div>
      <div class="result hidden" id="result">
        <div class="ck"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
        <div><b id="resultName"></b><span class="sub" id="t-cam_off"></span></div>
        <svg class="camoff" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 1l22 22M21 7l-5 4V7a2 2 0 0 0-2-2H8M3 5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h11"/></svg>
      </div>
      <div class="actions"><button class="primary" id="identify" type="button"></button></div>
      <div class="status" id="status" role="status"></div>
      <div class="privacy">
        <svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/></svg>
        <div><h4 id="t-privacy_title"></h4><p id="t-privacy"></p></div>
      </div>
    </div>

    <div class="card">
      <div class="kick"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11a3 3 0 1 0 0-6M22 21c0-3-2-5-5-5.5"/></svg><span id="crewTitle"></span></div>
      <button type="button" class="regbtn" id="regOpen" style="margin-top:10px"></button>
      <div class="regform hidden" id="regForm">
        <div class="fields">
          <label><span id="t-reg_name"></span><input type="text" id="regName" maxlength="24" autocomplete="off"></label>
          <label><span id="t-reg_role"></span><input type="text" id="regRole" maxlength="40" autocomplete="off"></label>
          <label><span id="t-reg_hr"></span><input type="number" id="regHr" value="65" step="1"></label>
          <label><span id="t-reg_sleep"></span><input type="number" id="regSleep" value="7.5" step="0.1"></label>
          <label><span id="t-reg_mood"></span><input type="number" id="regMood" value="8" step="1" min="1" max="10"></label>
        </div>
        <div class="small" id="t-reg_sensors"></div>
        <div class="sensorpick" id="sensorPick"></div>
        <label class="inline"><input type="checkbox" id="regConsent"> <span id="t-reg_consent"></span></label>
        <div class="actions" style="justify-content:flex-start"><button class="primary" id="regSave" type="button"></button><button id="regCancel" type="button"></button></div>
        <div class="small" id="regMsg"></div>
      </div>
      <div class="crewlist" id="crewList"></div>
      <div class="fb"><div class="lbl" id="t-fallback"></div><div class="small" id="t-fallback_hint"></div></div>
      <button type="button" class="primary proceed" id="proceed" disabled></button>
    </div>
  </section>

  <!-- ============ SCREEN 2: body scan ============ -->
  <section id="viewScan" class="scan hidden" aria-label="Body scan">
    <div class="card">
      <div class="crewbar"><div class="av" id="sAv">?</div><div><b id="sName">—</b><span class="small" id="sRole"></span></div></div>
      <div id="figure"></div>
      <div class="controls">
        <button class="primary" id="start" type="button"></button>
        <button id="changeCrew" type="button"></button>
        <label><span id="t-scenario"></span>
          <select id="scenario"><option value="normal" id="o-normal"></option><option value="fatigue" id="o-fatigue" selected></option><option value="fever" id="o-fever"></option></select>
        </label>
        <label class="inline"><input type="checkbox" id="voice" checked> <span id="t-voice"></span></label>
      </div>
      <div class="controls">
        <label class="inline"><input type="checkbox" class="layer" value="muscles" checked> <span id="t-muscles"></span></label>
        <label class="inline"><input type="checkbox" class="layer" value="bones" checked> <span id="t-bones"></span></label>
        <label class="inline"><input type="checkbox" class="layer" value="organs" checked> <span id="t-organs"></span></label>
        <label class="inline"><input type="checkbox" class="layer" value="labels" checked> <span id="t-labels"></span></label>
      </div>
    </div>
    <div class="card" aria-live="polite">
      <h2 id="t-sensors_active"></h2>
      <div class="sensors" id="sensorChips"></div>
      <h2 id="t-readout"></h2>
      <div id="readout"></div>
      <div class="note" id="t-note"></div>
    </div>
  </section>
</div>

<script type="module">
import { createBodyScan, ZONES } from "./body-scan.js";
import { speak, stopVoice, chime, setVoiceLang, setVoiceEnabled } from "./voice.js";
import { makeT } from "./i18n.js";
import { createFaceId } from "./face-id.js";

let LANG = "es";
try { const s = localStorage.getItem("galley-lang"); if (s === "en" || s === "es") LANG = s; } catch (e) { /* storage blocked */ }
const t = makeT(() => LANG);
const $ = (s) => document.querySelector(s);
const esc = (x) => String(x).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* ===== Ranges. From contracts/medical-ranges-config.json (ISS) unless marked demo.
   red if v < rMin or v > rMax; amber if outside [gMin, gMax].
   sleep and mood: config's red_high really means "red at or below", so it is used as rMin. ===== */
const RANGES = {
  sleep:    { gMin: 7.0, gMax: 9.5, rMin: 5.5, rMax: 24,  lo: 3,   hi: 11 },
  mood:     { gMin: 7,   gMax: 10,  rMin: 5,   rMax: 11,  lo: 1,   hi: 10 },
  temp:     { gMin: 36.1, gMax: 37.3, rMin: 35.0, rMax: 38.5, lo: 34.5, hi: 39.5 },
  hr:       { gMin: 50,  gMax: 90,  rMin: 40,  rMax: 120, lo: 30,  hi: 140 },
  bp:       { gMin: 95,  gMax: 130, rMin: 85,  rMax: 160, lo: 70,  hi: 180 },
  spo2:     { gMin: 95,  gMax: 100, rMin: 90,  rMax: 101, lo: 85,  hi: 100, demo: true },

];

const rank = { ok: 0, warn: 1, crit: 2 };
function statusOf(k, v) {
  const r = RANGES[k];
  if (v < r.rMin || v > r.rMax) return "crit";
  if (v < r.gMin || v > r.gMax) return "warn";
  return "ok";
}
function evaluate(vals, sensors) {
  const out = { zones: {}, metrics: {} };
  for (const z of ZONES) {
    const keys = ZONE_METRICS[z].filter((k) => sensors.includes(k));
    if (!keys.length) { out.zones[z] = { st: null, key: null, keys }; continue; }
    let worst = "ok", worstKey = keys[0];
    for (const k of keys) {
      const st = statusOf(k, vals[k]); out.metrics[k] = st;
      if (rank[st] > rank[worst]) { worst = st; worstKey = k; }
    }
    out.zones[z] = { st: worst, key: worstKey, keys };
  }
  const sts = Object.values(out.metrics);
  out.level = sts.includes("crit") ? 3 : sts.filter((s) => s === "warn").length >= 2 ? 2 : 1;
  return out;
}

/* ===== formatting ===== */
let BASE = { ...DEFAULT_BASE };
function fmt(k, v, vals) {
  if (k === "bp") return `${Math.round(v)}/${Math.round(vals.bpd)}`;
  const one = (k === "sleep" || k === "temp") ? v.toFixed(1) : String(Math.round(v));
  return LANG === "es" ? one.replace(".", ",") : one;
}
const ICON = {
  ok: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="currentColor" opacity=".25"/><path d="M4.5 8.2l2.3 2.3 4.7-4.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  warn: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5l7 12.5H1z" fill="currentColor" opacity=".25"/><path d="M8 6v4M8 12v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  crit: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="3" fill="currentColor" opacity=".25"/><path d="M5 5l6 6M11 5l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};
const COLOR = { ok: "var(--ok)", warn: "var(--warn)", crit: "var(--crit)" };
function rangeBar(k, v) {
  const r = RANGES[k], W = 200, H = 16, X = (x) => Math.max(0, Math.min(W, ((x - r.lo) / (r.hi - r.lo)) * W));
  const seg = (a, b, c) => `<rect x="${X(a)}" y="5" width="${Math.max(0, X(b) - X(a))}" height="6" fill="${c}" opacity=".55"/>`;
  return `<svg class="rbar" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">` +
    seg(r.lo, r.rMin, "#ff4d4f") + seg(r.rMin, r.gMin, "#f5b301") + seg(r.gMin, r.gMax, "#2ecc71") +
    seg(r.gMax, Math.min(r.rMax, r.hi), "#f5b301") + (r.rMax < r.hi ? seg(r.rMax, r.hi, "#ff4d4f") : "") +
    `<line x1="${X(BASE[k])}" x2="${X(BASE[k])}" y1="2" y2="14" stroke="#9fb0d3" stroke-width="1.5" stroke-dasharray="2 2"/>` +
    `<circle cx="${X(v)}" cy="8" r="5" fill="#e8eefc" stroke="#070d18" stroke-width="2"/></svg>`;
}
function zoneCard(z, R, vals) {
  const zs = R.zones[z];

    return `<div class="zone none" data-zone="${z}"><div class="zhead"><h3>${t("zone_" + z)}</h3><span class="small">${t("no_sensor")}</span></div></div>`;
  }
  let rows = "";
  for (const k of zs.keys) {
    const st = R.metrics[k];
    rows += `<div class="metric">
      <div class="name" style="color:${COLOR[st]}">${ICON[st]}<span style="color:var(--text)">${t("m_" + k)}${RANGES[k].demo ? ' <span class="src">(demo)</span>' : ""}<span class="dev">${DEVICE[k]}</span></span></div>
      <div><span class="val">${fmt(k, vals[k], vals)}<small>${t("u_" + k)}</small></span><div class="usual">${t("usual")}: ${fmt(k, BASE[k], BASE)}</div></div>
      <div>${rangeBar(k, vals[k])}</div></div>`;
  }
  const advice = zs.st === "ok" ? "" : `<p class="advice">${t("adv_" + zs.key)}</p>`;
  return `<div class="zone ${zs.st}" data-zone="${z}">
    <div class="zhead"><h3>${t("zone_" + z)}</h3><span class="chip ${zs.st}">${ICON[zs.st]}${t("st_" + zs.st)}</span></div>
    ${rows}${advice}
    <div class="src">${t("source")}: <a href="${SOURCES[z]}" target="_blank" rel="noopener">nasa.gov</a></div></div>`;
}

/* load models, then turn the camera on. show(key, isError) reports progress. Returns true when the camera is live. */
async function bootCamera(show) {
  try { show("st_loading"); await face.ensure(); }
  catch (e) { show("models_fail", true); return false; }
  $("#camSrc").textContent = face.source === "local" ? "models: local" : "models: CDN";
  try { show("st_camera"); await face.startCam(); }
  catch (e) { face.stopCam(); show(face.camErrorKey(e), true); return false; }
  return true;
}

let idToken = 0;
async function identify() {
  const token = ++idToken;
  $("#identify").disabled = true; $("#result").classList.add("hidden");
  face.stopPreview(); $("#regForm").classList.add("hidden");
  if (!face.list().length) { setStatus("st_noprof", null, "warn"); openRegister(); $("#identify").disabled = false; return; }
  setPill("sensing");
  const ok = await bootCamera((k, err) => setStatus(k, null, err ? "warn" : ""));
  if (!ok) { setPill("standby"); $("#identify").disabled = false; return; }
  const res = await face.identify({ timeoutMs: 12000, onStatus: (s) => setStatus(s === "look" ? "st_look" : "st_match"), isCancelled: () => token !== idToken });
  face.stopCam();
  $("#identify").disabled = false;
  if (res.status !== "ok") { setPill("standby"); if (res.status === "timeout") setStatus("st_timeout", null, "warn"); return; }
  const c = crewAll().find((x) => x.id === res.id);
  select(c, "face", res.dist);
  setStatus("opening", null, "");
  setTimeout(() => { if (selected && selected.id === c.id && selectedBy === "face") goScan(true); }, 1800);
}

function buildSensorPick() {
  $("#sensorPick").innerHTML = ALL_SENSORS.map((k) =>
    `<label class="inline"><input type="checkbox" class="spk" value="${k}" checked> <span>${t("m_" + k)} · ${DEVICE[k]}</span></label>`).join("");
}
async function openRegister() {
  $("#regForm").classList.remove("hidden"); buildSensorPick();
  $("#regName").focus();
  if (!face.isLive()) {
    const ok = await bootCamera((k) => regMsg(k));
    if (!ok) return;
  }
  setPill("sensing");
  face.preview((det) => regMsg(det ? "prev_face" : "prev_noface"));
}
async function saveRegister() {
  const name = $("#regName").value.trim();
  if (!name) return regMsg("reg_need_name");
  if (face.exists(name)) return regMsg("reg_exists");
  const hr = parseFloat($("#regHr").value), sleep = parseFloat(String($("#regSleep").value).replace(",", ".")), mood = parseFloat($("#regMood").value);
  if (!(hr >= 35 && hr <= 120 && sleep >= 3 && sleep <= 12 && mood >= 1 && mood <= 10)) return regMsg("reg_bad");
  const sensors = [...document.querySelectorAll(".spk:checked")].map((x) => x.value);
  if (!sensors.length) return regMsg("reg_bad");
  if (!$("#regConsent").checked) return regMsg("reg_need_consent");
  $("#regSave").disabled = true;
  face.stopPreview();
  try {
    if (!face.isLive()) { const ok = await bootCamera((k) => regMsg(k)); if (!ok) return; }
    regMsg("reg_look");
    const r = await face.register(name, { hr, sleep, mood }, { role: $("#regRole").value.trim(), sensors },
      (n, total) => regMsg("reg_progress", { n, total }));
    if (!r.ok) { regMsg("reg_noface"); face.preview((det) => regMsg(det ? "prev_face" : "prev_noface")); return; }
    face.stopCam(); setPill("standby");
    /* show the captured photo in the viewfinder card */

    $("#idWho").textContent = r.profile.name; $("#idRole").textContent = r.profile.role || ""; $("#idDist").textContent = "";
    $("#regForm").classList.add("hidden"); $("#regName").value = ""; $("#regConsent").checked = false;
    setStatus(r.stored ? "reg_ok" : "reg_nostore", { name: r.profile.name }, r.stored ? "" : "warn");

}

async function runCheck() {
  if (running || !selected) return;
  running = true; const token = ++runToken; $("#start").disabled = true;
  stopVoice(); setVoiceLang(LANG); setVoiceEnabled($("#voice").checked);
  const vals = SCEN[$("#scenario").value];
  const R = evaluate(vals, selected.sensors);
  last = { vals, R, shown: [] };
  $("#readout").innerHTML = "";
  await speak(t("say_sensors", { name: selected.name, n: selected.sensors.length }));
  if (token !== runToken) return;
  const statuses = {}; for (const z of ZONES) statuses[z] = R.zones[z].st;
  await fig.run(statuses, {
    onZone: async (z, st) => {
      if (token !== runToken) return;
      last.shown.push(z);
      $("#readout").insertAdjacentHTML("beforeend", zoneCard(z, R, vals));
      const keys = R.zones[z].keys;
      if (keys.length) fig.setLabel(z, `${t("m_" + keys[0])} ${fmt(keys[0], vals[keys[0]], vals)} ${t("u_" + keys[0])}`);
      if (z === "chest" && keys.includes("hr")) fig.setHeartRate(vals.hr);
      if (!st || st === "ok") return; /* calm voice: only zones that need attention */
      const key = R.zones[z].key, r = RANGES[key];
      const dir = vals[key] < r.gMin ? t("low") : t("high");
      await speak(t("say_zone", { zone: t("zone_" + z), metric: t("m_" + key), value: `${fmt(key, vals[key], vals)} ${t("u_" + key)}`, dir, advice: t("adv_" + key) }));
    }
  });
  if (token !== runToken) return;
  const lvlSt = R.level === 3 ? "crit" : R.level === 2 ? "warn" : "ok";
  $("#readout").insertAdjacentHTML("beforeend", `<div class="summary ${lvlSt}"><h3>${t("lvl" + R.level)}</h3><div>${t("lvl" + R.level + "_do")}</div></div>`);
  if (selected.face) face.touch(selected.id);
  chime(lvlSt);
  await speak(t("say_end", { level: t("lvl" + R.level), todo: t("lvl" + R.level + "_do") }));
  running = false; $("#start").disabled = false; $("#start").textContent = t("again");
}
function rerenderReadout() {
  if (!last) { $("#readout").innerHTML = `<p class="empty">${t("waiting")}</p>`; return; }
  const { vals, R, shown } = last;
  let html = shown.map((z) => zoneCard(z, R, vals)).join("");
  if (shown.length === ZONES.length && !running) {
    const lvlSt = R.level === 3 ? "crit" : R.level === 2 ? "warn" : "ok";
    html += `<div class="summary ${lvlSt}"><h3>${t("lvl" + R.level)}</h3><div>${t("lvl" + R.level + "_do")}</div></div>`;
  }
  $("#readout").innerHTML = html;
  for (const z of shown) { const k = R.zones[z].keys[0]; if (k) fig.setLabel(z, `${t("m_" + k)} ${fmt(k, vals[k], vals)} ${t("u_" + k)}`); }
}

function setLang(l) { LANG = l; try { localStorage.setItem("galley-lang", l); } catch (e) { /* storage blocked */ } stopVoice(); applyLang(); }
function tick() {
  const now = new Date(), s = Math.max(0, Math.floor((now - MISSION_START) / 1000));
  const p = (n) => String(n).padStart(2, "0");
  $("#met").textContent = `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}`;
  $("#utc").textContent = now.toISOString().slice(0, 19).replace("T", " ");
}

$("#langEs").addEventListener("click", () => setLang("es"));
$("#langEn").addEventListener("click", () => setLang("en"));
$("#identify").addEventListener("click", identify);
$("#regOpen").addEventListener("click", openRegister);
$("#regSave").addEventListener("click", saveRegister);
$("#regCancel").addEventListener("click", cancelRegister);
$("#proceed").addEventListener("click", () => goScan(true));
$("#start").addEventListener("click", runCheck);
$("#changeCrew").addEventListener("click", backToLogin);
$("#voice").addEventListener("change", (e) => setVoiceEnabled(e.target.checked));
setPill("standby"); setStatus("st_ready");
applyLang(); tick(); setInterval(tick, 1000);
</script>
