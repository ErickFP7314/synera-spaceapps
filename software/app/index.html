<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galley — the check-up that does itself</title>
<meta name="description" content="Galley: an on-device daily health check-up for astronauts. Compares each crew member with their own 14-day normal, using real NASA data. Decision support, not a medical device.">
<meta name="theme-color" content="#e9e7e1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%231b1d1f'/%3E%3Cpath d='M9 16h4l2-5 3 10 2-5h3' fill='none' stroke='%23f7f6f2' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="fonts/atkinson-next.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>
  /* apply the saved or system lighting before first paint */
  (function () {
    var t = null;
    try { t = localStorage.getItem("galley-theme"); } catch (e) {}
    if (t !== "day" && t !== "night") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
    document.documentElement.dataset.theme = t;
    if (window.IntersectionObserver && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)) document.documentElement.classList.add("js-reveal");
  })();
</script>
</head>
<body>
<a class="skip" href="#main" data-t="skip"></a>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#checkin"><b>GALLEY</b><span data-t="by_team"></span></a>
    <nav aria-label="Sections" id="nav">
      <a href="#checkin" data-t="nav_checkin"></a>
      <a href="#scan" data-t="nav_scan"></a>
      <a href="#earth" data-t="nav_earth"></a>
      <a href="#weather" data-t="nav_weather"></a>
      <a href="#trends" data-t="nav_trends"></a>
      <a href="#science" data-t="nav_science"></a>
    </nav>
    <div class="bar-tools">
      <span class="met">MET <b id="met">--:--:--</b></span>
      <div class="seg" role="group" id="themeSeg" data-t-aria="lighting">
        <button type="button" data-theme-set="day"><svg data-icon="sun"></svg><span class="lbl-l" data-t="day"></span></button>
        <button type="button" data-theme-set="night"><svg data-icon="moon"></svg><span class="lbl-l" data-t="presleep"></span></button>
      </div>
      <div class="seg" role="group" aria-label="Language / Idioma">
        <button type="button" data-lang-set="en" lang="en">EN</button>
        <button type="button" data-lang-set="es" lang="es">ES</button>
      </div>
    </div>
  </div>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
</header>

<main id="main">
  <!-- ============ CHECK-IN ============ -->
  <section id="checkin" class="sec hero" aria-labelledby="h-checkin">
    <div class="hero-copy">
      <h1 id="h-checkin" data-t="hero_title"></h1>
      <p class="lede" data-t="hero_lede"></p>
      <ul class="facts">
        <li><svg data-icon="user"></svg><span data-t-html="fact_normal"></span></li>
        <li><svg data-icon="data"></svg><span data-t-html="fact_data"></span></li>
        <li><svg data-icon="orbit"></svg><span data-t-html="fact_env"></span></li>
      </ul>
      <div class="hero-cta">
        <a class="btn" href="#scan" id="demoGo"><svg data-icon="scan"></svg><span data-t="try_demo"></span></a>
      </div>
      <p class="disclaimer"><svg data-icon="shield"></svg><span data-t="disclaimer_short"></span></p>
    </div>

    <div class="panel checkin" data-code="NOD2·D4">
      <div class="vf" id="vf">
        <video id="camVideo" playsinline muted></video>
        <canvas id="camOverlay"></canvas>
        <div class="idle" id="vfIdle"><div><svg data-icon="camera"></svg><span data-t="cam_idle"></span></div></div>
        <div class="reticle" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="pill" id="pill"><i></i><span id="pillText"></span></div>
        <div class="idcard" id="idcard" hidden><div class="face" id="idFace"></div><div><b id="idWho"></b><small id="idDist"></small></div></div>
      </div>
      <div class="row">
        <button class="btn primary" id="identify" type="button"><svg data-icon="camera"></svg><span data-t="identify"></span></button>
        <button class="btn" id="regOpen" type="button"><svg data-icon="plus"></svg><span data-t="reg_new"></span></button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div class="result" id="result" hidden><svg data-icon="check"></svg><div><b id="resultName"></b> <span data-t="cam_off"></span></div></div>

      <div class="regform" id="regForm" hidden>
        <div class="fields">
          <label class="field"><span data-t="reg_name"></span><input type="text" id="regName" maxlength="24" autocomplete="off"></label>
          <label class="field"><span data-t="reg_role"></span><input type="text" id="regRole" maxlength="40" autocomplete="off"></label>
          <label class="field"><span data-t="reg_hr"></span><input type="number" id="regHr" value="62" step="1" min="35" max="120" inputmode="numeric"></label>
          <label class="field"><span data-t="reg_sleep"></span><input type="number" id="regSleep" value="6.6" step="0.1" min="3" max="12" inputmode="decimal"></label>
          <label class="field"><span data-t="reg_mood"></span><input type="number" id="regMood" value="4" step="1" min="1" max="5" inputmode="numeric"></label>
        </div>
        <label class="check"><input type="checkbox" id="regConsent"><span data-t="reg_consent"></span></label>
        <div class="row"><button class="btn primary" id="regSave" type="button"><span data-t="reg_save"></span></button><button class="btn ghost" id="regCancel" type="button"><span data-t="cancel"></span></button></div>
        <p class="status" id="regMsg" role="status" aria-live="polite"></p>
      </div>

      <div class="crew">
        <h2 class="crew-h"><span id="crewTitle"></span></h2>
        <div class="crewlist" id="crewList"></div>
      </div>
      <button class="btn primary" id="proceed" type="button"><svg data-icon="scan"></svg><span id="proceedText"></span></button>
      <div class="privacy"><svg data-icon="lock"></svg><p data-t="privacy"></p></div>
    </div>
  </section>

  <!-- ============ SCAN ============ -->
  <section id="scan" class="sec" aria-labelledby="h-scan">
    <div class="sec-head">
      <div><h2 id="h-scan"><span data-t="scan_title"></span><span class="loc">LAB1·02</span></h2><p data-t="scan_sub"></p></div>
      <p class="src-line" id="dataSource"></p>
    </div>

    <div class="panel controls" data-code="LAB1·O2">
      <div class="crewtag"><span class="av" id="sAv">?</span><div><b id="sName">—</b><small id="sRole"></small></div></div>
      <label class="ctl"><span data-t="scenario"></span>
        <select class="input" id="scenario"></select>
      </label>
      <div class="ctl"><span id="dayLabel" data-t="day_of"></span>
        <div class="dayctl"><input type="range" id="day" min="1" max="14" value="13" aria-labelledby="dayLabel"><output id="dayOut" for="day">13/14</output></div>
      </div>
      <div class="ctl"><span id="envLabel" data-t="environment"></span>
        <div class="seg" role="group" id="envSeg" aria-labelledby="envLabel">
          <button type="button" data-env="ISS">ISS</button><button type="button" data-env="MOON" data-t="moon"></button><button type="button" data-env="MARS" data-t="mars"></button>
        </div>
      </div>
      <div class="ctl"><span data-t="voice"></span>
        <div class="seg" role="group"><button type="button" id="voiceBtn" aria-pressed="true"><svg data-icon="volume"></svg><span id="voiceText"></span></button></div>
      </div>
      <div class="go">
        <button class="btn" id="serialBtn" type="button"><svg data-icon="usb"></svg><span id="serialText"></span></button>
        <button class="btn primary" id="start" type="button"><svg data-icon="play"></svg><span id="startText"></span></button>
      </div>
      <div class="livestrip" id="live" hidden></div>
    </div>

    <div class="next" id="next" hidden></div>

    <div class="scan-grid">
      <div class="panel figure-panel" data-code="BODY·A1">
        <div class="viewtoggle">
          <div class="seg" role="group" id="viewSeg" data-t-aria="view">
            <button type="button" data-view="2d" data-t="view_2d"></button>
            <button type="button" data-view="3d" data-t="view_3d"></button>
          </div>
        </div>
        <div id="figure2d"></div>
        <div id="figure3d" hidden></div>
        <p class="caption" id="caption" aria-live="polite"><svg data-icon="volume"></svg><span id="captionText"></span></p>
        <p class="voice-note" id="voiceNote" hidden></p>
      </div>
      <div class="readouts" id="readout"></div>
    </div>
  </section>

  <!-- ============ EARTH LINK ============ -->
  <section id="earth" class="sec" aria-labelledby="h-earth">
    <div class="sec-head"><div><h2 id="h-earth"><span data-t="earth_title"></span><span class="loc">COMM·S1</span></h2><p data-t="earth_sub"></p></div><p class="src-line" data-t="earth_src"></p></div>
    <div class="earth">
      <div class="panel delay" data-code="COMM·S1" data-reveal id="delayPanel"></div>
      <div class="panel sbar" data-code="SBAR·F1" data-reveal id="sbarPanel"></div>
    </div>
  </section>

  <!-- ============ SPACE WEATHER ============ -->
  <section id="weather" class="sec" aria-labelledby="h-weather">
    <div class="sec-head"><div><h2 id="h-weather"><span data-t="wx_title"></span><span class="loc">RAD·W1</span></h2><p data-t="wx_sub"></p></div><p class="src-line" data-t-html="wx_src"></p></div>
    <div class="weather">
      <div class="panel timeline draw" data-code="RAD·W2" data-reveal id="wxTimeline"></div>
      <div class="panel wx-side" data-code="RAD·W3" data-reveal id="wxSide"></div>
    </div>
  </section>

  <!-- ============ TRENDS ============ -->
  <section id="trends" class="sec" aria-labelledby="h-trends">
    <div class="sec-head"><div><h2 id="h-trends"><span data-t="trends_title"></span><span class="loc">TRD·T1</span></h2><p data-t="trends_sub"></p></div><p class="src-line" data-t="trends_src"></p></div>
    <div class="legend" id="trendLegend"></div>
    <div class="trends" id="trendGrid"></div>
  </section>

  <!-- ============ REAL ASTRONAUT DATA ============ -->
  <section id="science" class="sec" aria-labelledby="h-science">
    <div class="sec-head"><div><h2 id="h-science"><span data-t="sci_title"></span><span class="loc">OSD·00</span></h2><p data-t="sci_sub"></p></div><p class="src-line" data-t-html="sci_src"></p></div>
    <div class="science">
      <div class="panel osdr" data-code="OSD·575" data-reveal id="osdrPanel"></div>
      <div class="panel copy" data-code="OSD·569" data-reveal id="osdrCopy"></div>
    </div>
    <div class="panel sources" data-code="REF·00" data-reveal>
      <h3 data-t="sources_title"></h3>
      <ul id="sourceList"></ul>
    </div>
  </section>
</main>

<footer>
  <div class="foot">
    <p><b>Galley</b> · Team Synera · NASA Space Apps Challenge 2026 · <span data-t="disclaimer_long"></span></p>
    <p><a href="https://github.com/ErickFP7314/synera-spaceapps" rel="noopener">GitHub</a> · <a href="https://wokwi.com/projects/480771036190862337" rel="noopener" data-t="wokwi_link"></a></p>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
