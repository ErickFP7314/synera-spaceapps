<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" font-family="DejaVu Sans, Arial, sans-serif">
  <rect width="1200" height="780" fill="#ffffff"/>
  <text x="40" y="48" font-size="26" font-weight="bold" fill="#0b2545">Galley sensor node — wiring (ESP32 DevKit v1)</text>
  <text x="40" y="76" font-size="15" fill="#444">Team Synera · NASA Space Apps 2026 · USB serial 115200 baud · 1 JSON line per second (SerialFrame contract)</text>

  <!-- ===== Sensors (left) ===== -->
  <!-- MAX30102 -->
  <rect x="50" y="130" width="260" height="190" rx="10" fill="#f3f6fb" stroke="#0b2545" stroke-width="2"/>
  <text x="66" y="158" font-size="18" font-weight="bold" fill="#0b2545">MAX30102</text>
  <text x="66" y="178" font-size="13" fill="#444">Pulse (HR) + SpO₂ · I²C 0x57</text>
  <text x="66" y="196" font-size="12" fill="#a33">finger PPG — not clinical grade</text>
  <g font-size="14" fill="#111" text-anchor="end">
    <text x="300" y="224">VIN</text><text x="300" y="254">GND</text><text x="300" y="284">SDA</text><text x="300" y="314">SCL</text>
  </g>

  <!-- MAX30205 (option A) -->
  <rect x="50" y="350" width="260" height="190" rx="10" fill="#f6fbf3" stroke="#2d6a1f" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="66" y="378" font-size="18" font-weight="bold" fill="#2d6a1f">MAX30205</text>
  <text x="66" y="398" font-size="13" fill="#444">Skin temp ±0.1 °C · I²C 0x48</text>
  <text x="66" y="416" font-size="12" fill="#444">Temp option A · A0–A2 → GND</text>
  <g font-size="14" fill="#111" text-anchor="end">
    <text x="300" y="444">VCC</text><text x="300" y="474">GND</text><text x="300" y="504">SDA</text><text x="300" y="534">SCL</text>
  </g>

  <!-- DS18B20 (option B) -->
  <rect x="50" y="570" width="260" height="150" rx="10" fill="#f6fbf3" stroke="#2d6a1f" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="66" y="598" font-size="18" font-weight="bold" fill="#2d6a1f">DS18B20</text>
  <text x="66" y="618" font-size="13" fill="#444">Skin temp ±0.5 °C · 1-Wire</text>
  <text x="66" y="636" font-size="12" fill="#444">Temp option B</text>
  <g font-size="14" fill="#111" text-anchor="end">
    <text x="300" y="664">VCC</text><text x="300" y="689">DQ</text><text x="300" y="714">GND</text>
  </g>

  <!-- ===== Buses ===== -->
  <!-- 3V3 red: x=350 -->
  <g stroke="#d62728" stroke-width="3" fill="none">
    <line x1="350" y1="220" x2="350" y2="660"/>
    <line x1="310" y1="220" x2="350" y2="220"/><line x1="310" y1="440" x2="350" y2="440"/><line x1="310" y1="660" x2="350" y2="660"/>
    <line x1="350" y1="200" x2="350" y2="220"/><line x1="350" y1="200" x2="560" y2="200"/>
  </g>
  <!-- GND black: x=372 -->
  <g stroke="#222222" stroke-width="3" fill="none">
    <line x1="372" y1="250" x2="372" y2="710"/>
    <line x1="310" y1="250" x2="372" y2="250"/><line x1="310" y1="470" x2="372" y2="470"/><line x1="310" y1="710" x2="372" y2="710"/>
    <line x1="372" y1="240" x2="372" y2="250"/><line x1="372" y1="240" x2="560" y2="240"/>
  </g>
  <!-- SDA blue: x=394 -->
  <g stroke="#1f77b4" stroke-width="3" fill="none">
    <line x1="394" y1="280" x2="394" y2="500"/>
    <line x1="310" y1="280" x2="394" y2="280"/><line x1="310" y1="500" x2="394" y2="500"/>
    <line x1="394" y1="280" x2="560" y2="280"/>
  </g>
  <!-- SCL amber: x=416 -->
  <g stroke="#e6a700" stroke-width="3" fill="none">
    <line x1="416" y1="310" x2="416" y2="530"/>
    <line x1="310" y1="310" x2="416" y2="310"/><line x1="310" y1="530" x2="416" y2="530"/>
    <line x1="416" y1="320" x2="560" y2="320"/><line x1="416" y1="310" x2="416" y2="320"/>
  </g>
  <!-- 1-Wire green: x=438 -->
  <g stroke="#2ca02c" stroke-width="3" fill="none">
    <line x1="438" y1="360" x2="438" y2="685"/>
    <line x1="310" y1="685" x2="438" y2="685"/>
    <line x1="438" y1="360" x2="560" y2="360"/>
  </g>
  <!-- 4.7k pull-up between 1-Wire and 3V3 -->
  <g stroke="#555" stroke-width="2" fill="none">
    <line x1="350" y1="600" x2="368" y2="600"/>
    <polyline points="368,600 372,592 380,608 388,592 396,608 404,592 412,608 420,592 424,600" />
    <line x1="424" y1="600" x2="438" y2="600"/>
  </g>
  <text x="446" y="604" font-size="12" fill="#333">4.7 kΩ pull-up</text>

  <!-- junction dots -->
  <g fill="#111">
    <circle cx="350" cy="220" r="4.5"/><circle cx="350" cy="440" r="4.5"/><circle cx="350" cy="660" r="4.5"/><circle cx="350" cy="600" r="4.5"/>
    <circle cx="372" cy="250" r="4.5"/><circle cx="372" cy="470" r="4.5"/><circle cx="372" cy="710" r="4.5"/>
    <circle cx="394" cy="280" r="4.5"/><circle cx="394" cy="500" r="4.5"/>
    <circle cx="416" cy="310" r="4.5"/><circle cx="416" cy="530" r="4.5"/>
    <circle cx="438" cy="685" r="4.5"/><circle cx="438" cy="600" r="4.5"/>
  </g>

  <!-- ===== ESP32 ===== -->
  <rect x="560" y="150" width="240" height="380" rx="12" fill="#1f2a44" stroke="#0b2545" stroke-width="2"/>
  <text x="680" y="185" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle">ESP32 DevKit v1</text>
  <g font-size="14" fill="#ffffff">
    <text x="574" y="205">3V3</text>
    <text x="574" y="245">GND</text>
    <text x="574" y="285">GPIO21 · SDA</text>
    <text x="574" y="325">GPIO22 · SCL</text>
    <text x="574" y="365">GPIO4 · 1-Wire</text>
  </g>
  <text x="680" y="430" font-size="13" fill="#cfd8e3" text-anchor="middle">firmware: hardware/firmware/</text>
  <text x="680" y="448" font-size="13" fill="#cfd8e3" text-anchor="middle">wearable-node (auto-detects</text>
  <text x="680" y="466" font-size="13" fill="#cfd8e3" text-anchor="middle">sensors, sim fallback)</text>
  <rect x="790" y="345" width="22" height="34" rx="3" fill="#888"/>
  <text x="776" y="400" font-size="12" fill="#cfd8e3" text-anchor="end">micro-USB</text>

  <!-- ===== USB to laptop ===== -->
  <path d="M812 362 C 860 362, 860 362, 900 362" stroke="#555" stroke-width="6" fill="none"/>
  <text x="856" y="350" font-size="13" fill="#333" text-anchor="middle">USB</text><text x="856" y="384" font-size="11" fill="#333" text-anchor="middle">power +</text><text x="856" y="397" font-size="11" fill="#333" text-anchor="middle">data</text>
  <rect x="900" y="250" width="260" height="210" rx="12" fill="#f3f6fb" stroke="#0b2545" stroke-width="2"/>
  <text x="1030" y="282" font-size="18" font-weight="bold" fill="#0b2545" text-anchor="middle">Station screen</text>
  <text x="1030" y="306" font-size="14" fill="#333" text-anchor="middle">Chrome / Edge</text>
  <text x="1030" y="330" font-size="14" fill="#333" text-anchor="middle">Web Serial API · 115200</text>
  <text x="1030" y="364" font-size="16" font-weight="bold" fill="#0b2545" text-anchor="middle">Galley app</text>
  <text x="1030" y="388" font-size="13" fill="#333" text-anchor="middle">body scan · personal baseline</text>
  <text x="1030" y="408" font-size="13" fill="#333" text-anchor="middle">rules R1–R7 · S-B-A-R</text>

  <!-- ===== Frame example ===== -->
  <rect x="560" y="560" width="600" height="96" rx="10" fill="#0f172a"/>
  <text x="578" y="588" font-size="13" fill="#94a3b8">SerialFrame (1 Hz) — contracts/telemetry-payload.schema.json</text>
  <text x="578" y="618" font-size="15" fill="#e2e8f0" font-family="DejaVu Sans Mono, monospace">{"t":12,"hr":62,"spo2":97,"temp":36.6,"q":1,"src":"sensor"}</text>
  <text x="578" y="642" font-size="12" fill="#94a3b8">q=0 → no hr/spo2 · invalid values omitted · src:"sim" when the pulse sensor is absent</text>

  <!-- ===== Legend ===== -->
  <g font-size="13" fill="#333">
    <line x1="560" y1="690" x2="590" y2="690" stroke="#d62728" stroke-width="4"/><text x="596" y="695">3V3</text>
    <line x1="640" y1="690" x2="670" y2="690" stroke="#222" stroke-width="4"/><text x="676" y="695">GND</text>
    <line x1="724" y1="690" x2="754" y2="690" stroke="#1f77b4" stroke-width="4"/><text x="760" y="695">SDA</text>
    <line x1="806" y1="690" x2="836" y2="690" stroke="#e6a700" stroke-width="4"/><text x="842" y="695">SCL</text>
    <line x1="886" y1="690" x2="916" y2="690" stroke="#2ca02c" stroke-width="4"/><text x="922" y="695">1-Wire</text>
    <text x="560" y="722">Dashed boxes: use ONE skin-temperature sensor (auto-detected).</text><text x="560" y="742">Both measure skin temperature, not core temperature.</text>
  </g>
</svg>
