; PlatformIO Project Configuration File for Synera Wearable Node
; Target MCUs: ESP32-S3 or Nordic nRF52840 (BLE 5.0 Low Energy)

[platformio]
default_envs = esp32s3_node

[env:esp32s3_node]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D SYNERA_NODE_VERSION=\"1.0.0\"
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

[env:nrf52840_node]
platform = nordicnrf52
board = nrf52840_dk_ble
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
