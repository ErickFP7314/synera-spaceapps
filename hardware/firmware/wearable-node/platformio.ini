; Galley sensor node — PlatformIO
; Default: ESP32 DevKit v1 (esp32dev). Alternative: ESP32-S3 DevKitC.
; MVP link = USB serial 115200 (Web Serial API). BLE is future work.

[platformio]
default_envs = esp32dev

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1

; HR + SpO2 (Maxim algorithm, SparkFun spo2_algorithm.h). Try it at the 12:00 go/no-go.
[env:esp32dev_spo2]
platform = espressif32
board = esp32dev
build_flags = -DGALLEY_SPO2=1
